<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mirror</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300..700;1,300..700&family=Instrument+Serif:ital@0;1&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Lato:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root {
    --font-serif: 'Crimson Pro', 'Times New Roman', serif;
    --font-sans: 'Lato', system-ui, sans-serif;
    --font-mono: 'Lato', sans-serif;
  }
  /* Global scrollbars — same look as chat everywhere */
  * {
    box-sizing: border-box;
    scrollbar-width: thin;
    scrollbar-color: #B9CEF4 transparent;
  }
  *::-webkit-scrollbar {
    width: 7px;
    height: 7px;
  }
  *::-webkit-scrollbar-track {
    background: transparent;
  }
  *::-webkit-scrollbar-thumb {
    background: #B9CEF4;
    border-radius: 999px;
    border: 2px solid transparent;
    background-clip: padding-box;
  }
  *::-webkit-scrollbar-thumb:hover {
    background: #A3BFEB;
    background-clip: padding-box;
  }
  html, body { margin: 0; padding: 0; background: oklch(0.97 0.008 80); color: #141C21; font-family: var(--font-sans); scroll-behavior: smooth; }
  body { overflow-x: hidden; }
  @keyframes profileFadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes messageFade {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes caret {
    0%, 60% { opacity: 1; }
    61%, 100% { opacity: 0; }
  }
  @keyframes thinkingPulse {
    0%, 100% { transform: scale(0.7); opacity: 0.3; }
    50% { transform: scale(1); opacity: 1; }
  }
  button:focus-visible, textarea:focus-visible { outline: 2px solid oklch(0.55 0.10 240); outline-offset: 2px; }
  ::selection { background: oklch(0.82 0.06 230); color: #141C21; }

  /* Skip link for demo */
  .demo-shortcut {
    position: fixed; top: 16px; right: 16px; z-index: 100;
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.2em;
    text-transform: uppercase; color: #58666F;
    background: rgba(255,255,255,0.8); backdrop-filter: blur(8px);
    padding: 6px 12px; border: 1px solid oklch(0.85 0.01 240);
    border-radius: 999px; cursor: pointer;
  }

  @media print {
    .no-print { display: none !important; }
    body { background: white !important; }
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="src/tokens.jsx"></script>
<script type="text/babel" src="src/tweaks.jsx"></script>
<script type="text/babel" src="src/mirror-anthropic-shared.jsx"></script>
<script type="text/babel" src="src/claude-client.jsx"></script>
<script type="text/babel" src="src/landing.jsx"></script>
<script type="text/babel" src="src/sidebar.jsx"></script>
<script type="text/babel" src="src/conversation.jsx"></script>
<script type="text/babel" src="src/results.jsx"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

// A pre-baked demo recommendation for the "skip to results" shortcut,
// so reviewers can see the end state without a 10-minute conversation.
const DEMO_PROFILE = {
  essence: [
    { text: "Jess is a quiet maker who performs pre-med for her parents and makes zines at 2am for herself", confidence: 0.9 },
  ],
  values: [
    { text: "Creative autonomy (high)", confidence: 0.9 },
    { text: "Financial stability (medium)", confidence: 0.7 },
    { text: "Status/prestige (low, despite parental pressure)", confidence: 0.85 },
    { text: "Tangible craft (high)", confidence: 0.8 },
  ],
  workStyle: [
    { text: "Deep focus on hands-on projects", confidence: 0.85 },
    { text: "Dislikes rigid schedules", confidence: 0.8 },
    { text: "Thrives with long stretches of solo time, then small-team feedback", confidence: 0.75 },
  ],
  interests: [
    { text: "Zine-making and print layout", confidence: 0.95 },
    { text: "Repairing sewing machines", confidence: 0.85 },
    { text: "Physical materials (paper, fabric, ink)", confidence: 0.9 },
    { text: "Documentaries about small industries", confidence: 0.7 },
  ],
  social: [
    { text: "Quiet mediator in group conflict", confidence: 0.75 },
    { text: "Prefers 2-3 close collaborators over big teams", confidence: 0.85 },
    { text: "Uncomfortable with networking/self-promotion", confidence: 0.8 },
  ],
  pressure: [
    { text: "Strong family expectation toward pre-med — rooted in immigrant-family stability narrative, not her own interest.", severity: "strong" },
    { text: "Uses the word 'should' when describing med school. Uses 'love' when describing her zines.", severity: "moderate" },
  ],
};

const DEMO_RECS = {
  summary: "You're someone who needs to make things with their hands, but has been quietly performing 'serious' because that's what love sounds like at home. The work that will fit you sits at the intersection of tactile craft and careful documentation — and you already do it, you just don't call it a career yet.",
  careers: [
    {
      title: "Book Conservator",
      oneLine: "Restores rare and historic books using hand tools, paper chemistry, and years of patient craft.",
      why: "You told me the thing you lose track of time on is fixing your grandmother's sewing machine — small brass parts, patience, the feeling of returning something to working order. Book conservation is exactly that instinct applied to paper. Museums, university libraries, and archives employ conservators full-time, and the field rewards the kind of quiet focus you already have.",
      salary: "$52,000–$78,000",
      outlook: "Small field, steady demand. Growth ~5% — slow but stable, with almost no layoff risk in institutional roles.",
      aiRisk: "low — physical restoration work requires human hands and judgment; AI may help with cataloging but cannot replace the craft.",
      dayToDay: "Mornings in a climate-controlled lab bent over a 17th-century manuscript. Afternoons mixing wheat-starch paste, testing fiber samples, writing treatment reports. Mostly solo with weekly team reviews.",
      progression: "5 yr: senior conservator. 10 yr: lead conservator at a major library or private studio. 20 yr: private practice serving collectors, or department head training the next generation.",
      workLifeBalance: "Standard 9-5 in institutional roles. Lab work, so no remote. Low after-hours demand. Long, patient project timelines — you take a book home in your head, not physically.",
      schools: "You mentioned wanting to stay within a day's drive of home — so look at NYU's Conservation Center, Winterthur/U. Delaware, or Buffalo State. All three are top programs and all three have stipended tracks.",
      humanVoice: "The day I finally stopped trying to make conservation sexy for my family was the day I loved my job. They still don't quite get it. But the books do.",
    },
    {
      title: "Medical Illustrator",
      oneLine: "Creates precise, publication-grade illustrations of anatomy, surgery, and scientific processes.",
      why: "This is the career that pays attention to both your parents and you. You know the medical vocabulary — you've been rehearsing it for a decade. But instead of performing it in a white coat, you'd be drawing it. Medical illustrators are the reason textbooks and surgical training materials exist. It's a graduate-level field (Johns Hopkins has the flagship program) but the work is exactly the intersection of craft, science, and focused solo time you described.",
      salary: "$70,000–$110,000",
      outlook: "Niche but expanding with medical AR/VR training. ~10% growth.",
      aiRisk: "medium — generative tools will handle routine diagrams, but peer-reviewed and surgical accuracy still requires trained illustrators.",
      dayToDay: "Reference-heavy mornings at the drawing tablet. Afternoons consulting with surgeons or researchers. Quarterly: observing real procedures for accuracy.",
      progression: "5 yr: staff illustrator at a medical publisher or hospital. 10 yr: senior freelance with repeat clients. 20 yr: running your own studio or teaching at a graduate program.",
      workLifeBalance: "Mostly desk-based, often hybrid after year two. 40-50 hour weeks with occasional deadline crunch. Remote-friendly once established.",
      schools: "Johns Hopkins (Art as Applied to Medicine) is the flagship — two-year MA. Alternatives: U. Illinois Chicago, U. Toronto, Augusta University.",
      humanVoice: "My mom stopped asking when I was going to 'finish med school' the first time she saw my work in a textbook. It wasn't the money that changed her mind. It was the word 'Hopkins' on my degree.",
    },
    {
      title: "Textile Designer",
      oneLine: "Designs woven, printed, and knitted fabrics for fashion, interiors, and industrial applications.",
      why: "You didn't say the word 'textile' once, but you talked for five minutes about the sewing machine. About the exact weight of denim, about how the needle tension changes with the thread. That's a designer's ear. It's a real industry with an entry path through schools like RISD or FIT, and the work spans art studios, tech fabrics, and heritage brands.",
      salary: "$55,000–$85,000",
      outlook: "Steady, with rising demand in sustainable and technical textiles.",
      aiRisk: "medium — pattern generation tools are improving, but material knowledge and tactile judgment remain human.",
      dayToDay: "CAD mornings, swatch-mixing afternoons. Factory visits monthly. Seasonal crunch around design calendars.",
      progression: "5 yr: senior designer at a house. 10 yr: creative director at a mid-size brand. 20 yr: own label or consulting studio.",
      workLifeBalance: "Studio-based, 40-50 hours, seasonal crunch around fashion calendars. Factory visits a few times a year. Remote rare in entry roles, common later.",
      schools: "RISD and FIT are the canonical choices. Parsons for fashion-adjacent. If cost matters: NC State has a strong, under-the-radar textile program at state tuition.",
      humanVoice: "I draw something on Monday and hold it as cloth by Friday. Nothing else I've done has that feedback loop.",
    },
    {
      title: "Science Journalism (Print/Long-form)",
      oneLine: "Writes in-depth narrative stories about science, medicine, and research for magazines and book publishers.",
      why: "You said you watch documentaries about small industries 'because someone cared enough to ask the weird questions.' That's the job description for a long-form journalist. You already have the medical vocabulary, you love print as a medium, and the patient attention you bring to repair work is exactly the temperament needed for a 10,000-word investigative piece.",
      salary: "$48,000–$95,000 (wide range, freelance-heavy)",
      outlook: "Consolidating, but strong long-form demand at outlets like The Atlantic, NYT Mag, and independent newsletters.",
      aiRisk: "medium-high for daily news; low for investigative narrative reporting.",
      dayToDay: "Reporting trips, interview transcription, 6-month story arcs. Mostly solo with editor check-ins.",
      progression: "5 yr: staff at a science desk. 10 yr: contributing editor at a major magazine. 20 yr: book deals, documentary consulting.",
      workLifeBalance: "Heavily self-directed. Long independent stretches, reporting trips as needed. Remote-friendly. Freelance common — feast-or-famine income early on.",
      schools: "MIT's Graduate Program in Science Writing and NYU's SHERP are the specialist options. General journalism programs at Missouri, Northwestern, or Columbia also feed into science desks.",
      humanVoice: "The first piece I ever cared about was 6,000 words on a guy who repairs pipe organs. Eight years later that's still the bar I'm chasing.",
    },
  ],
  obscure: [
    {
      title: "Paper Conservator at a National Archive",
      oneLine: "A specialized branch of conservation focused on government documents, maps, and historic correspondence.",
      why: "This is an even quieter version of book conservation. Federal archives (NARA, Library of Congress) hire conservators with stable government benefits. You'd work on things like original Lincoln letters. It's the kind of job that's never advertised on LinkedIn but exists in every capital.",
    },
    {
      title: "Orthotist / Prosthetist",
      oneLine: "Designs and fabricates custom braces, limbs, and assistive devices for patients.",
      why: "Think of this as the craft version of medicine. You work with patients one-on-one, but the bulk of the job is workshop hours: molding, fitting, adjusting. Masters program, clinical residency, then steady $75k+ work. Addresses the medical pull without being med school.",
    },
  ],
};

function App() {
  const { tweaks, setTweaks, editMode } = useTweaks();
  const [screen, setScreen] = useState('landing'); // landing | chat | results
  const [profile, setProfile] = useState(EMPTY_PROFILE);
  const [phase, setPhase] = useState(1);
  const [recommendations, setRecommendations] = useState(null);

  // Restore position
  useEffect(() => {
    const saved = localStorage.getItem('mirror:screen');
    if (saved && ['landing', 'chat', 'results'].includes(saved)) {
      setScreen(saved);
      if (saved === 'results') {
        setProfile(DEMO_PROFILE);
        setRecommendations(DEMO_RECS);
        setPhase(3);
      }
    }
  }, []);

  useEffect(() => {
    localStorage.setItem('mirror:screen', screen);
  }, [screen]);

  const goToChat = () => {
    window.scrollTo(0, 0);
    setScreen('chat');
  };

  const goToResults = (recs) => {
    setRecommendations(recs);
    window.scrollTo(0, 0);
    setScreen('results');
  };

  const startOver = () => {
    setProfile(EMPTY_PROFILE);
    setPhase(1);
    setRecommendations(null);
    window.scrollTo(0, 0);
    setScreen('landing');
  };

  const demoSkipToResults = () => {
    setProfile(DEMO_PROFILE);
    setRecommendations(DEMO_RECS);
    setPhase(3);
    window.scrollTo(0, 0);
    setScreen('results');
  };

  return (
    <>
      {screen === 'landing' && <LandingPage onBegin={goToChat} />}
      {screen === 'chat' && (
        <ConversationView
          profile={profile} setProfile={setProfile}
          phase={phase} setPhase={setPhase}
          onResults={goToResults}
          sidebarVariant={tweaks.sidebar}
          onGoBack={startOver}
        />
      )}
      {screen === 'results' && (
        <ResultsView
          recommendations={recommendations}
          profile={profile}
          onStartOver={startOver}
          sidebarVariant={tweaks.sidebar}
        />
      )}

      {/* Demo navigator — lets reviewers jump states without running full convo */}
      <DemoNav screen={screen} onGoTo={(s) => {
        if (s === 'results') demoSkipToResults();
        else if (s === 'chat') goToChat();
        else startOver();
      }} />

      <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} visible={editMode} />
    </>
  );
}

function DemoNav({ screen, onGoTo }) {
  const stages = [
    { id: 'landing', label: 'Landing' },
    { id: 'chat', label: 'Conversation' },
    { id: 'results', label: 'Results (demo)' },
  ];
  return (
    <div className="no-print" style={{
      position: 'fixed', left: 20, bottom: 20, zIndex: 9998,
      display: 'flex', gap: 4,
      padding: 4,
      background: 'rgba(255,255,255,0.88)',
      backdropFilter: 'blur(20px) saturate(1.4)',
      WebkitBackdropFilter: 'blur(20px) saturate(1.4)',
      border: '1px solid rgba(22,40,66,0.08)',
      borderRadius: 999,
      boxShadow: '0 12px 40px rgba(22,40,66,0.12)',
      fontFamily: "'Lato', sans-serif",
      fontSize: 10, letterSpacing: '0.18em', textTransform: 'uppercase',
    }}>
      <span style={{
        padding: '8px 10px 8px 14px',
        color: '#58666F',
        fontWeight: 600,
        display: 'flex', alignItems: 'center',
      }}>v1</span>
      {stages.map(s => (
        <button key={s.id} onClick={() => onGoTo(s.id)} style={{
          padding: '8px 14px',
          border: 'none',
          background: screen === s.id ? 'oklch(0.22 0.015 240)' : 'transparent',
          color: screen === s.id ? '#141C21' : '#58666F',
          borderRadius: 999, cursor: 'pointer',
          fontFamily: 'inherit', fontSize: 10, letterSpacing: '0.18em', textTransform: 'uppercase',
        }}>{s.label}</button>
      ))}
      <a href="Mirror v2.html" style={{
        padding: '8px 14px', borderRadius: 999,
        color: '#58666F', textDecoration: 'none',
        fontFamily: 'inherit', fontSize: 10, letterSpacing: '0.18em', textTransform: 'uppercase',
        display: 'flex', alignItems: 'center',
        marginLeft: 4, paddingLeft: 14, fontWeight: 600,
      }}>v2 →</a>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
